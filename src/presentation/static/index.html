<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live Monitor Dashboard</title>
    <!-- CSS Giao diện -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Font chữ -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <!-- Thư viện HLS.js để phát video thật -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="dashboard-container">
        <!-- THANH TOP (Input URL) -->
        <header class="top-bar glass-panel">
            <div class="logo">
                <span class="gradient-text">LIVE MONITORING</span>
            </div>
            <form id="stream-form" class="url-input-form">
                <input type="text" id="stream-id" value="channel-01" required placeholder="Stream ID (VD: ch-01)" class="small-input">
                <input type="url" id="master-url" value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" required placeholder="Nhập HLS Master URL (.m3u8)">
                <button type="submit" class="btn btn-primary" id="btn-start">Connect</button>
            </form>
            <div class="connection-status" id="ws-status">
                <span class="dot standby"></span> STANDBY
            </div>
        </header>

        <div class="main-layout">
            <!-- CENTER: VIDEO & TELEMETRY -->
            <div class="center-column">
                <section class="video-section glass-panel">
                    <div class="video-wrapper">
                        <!-- Trình phát video thật -->
                        <video id="live-video" controls muted autoplay></video>
                    </div>
                    
                    <!-- Thanh Audio Meter giả lập OBS -->
                    <div class="audio-meter-container" title="Audio Meter">
                        <div class="audio-meter-bg">
                            <div id="audio-level" class="audio-level"></div>
                        </div>
                    </div>
                </section>

                <!-- TELEMETRY STATS (Horizontal) -->
                <section class="telemetry-panel glass-panel horizontal-telemetry">
                    <div class="telemetry-header">
                        <h2>Telemetry</h2>
                        <div class="control-actions">
                            <button type="button" class="btn btn-secondary" id="btn-pause">Pause</button>
                            <button type="button" class="btn btn-secondary" id="btn-resume">Resume</button>
                            <button type="button" class="btn btn-danger" id="btn-stop">Stop</button>
                        </div>
                    </div>
                    <div class="telemetry-grid">
                        <div class="stat-box" id="stat-status">
                            <span class="label">System Status</span>
                            <span class="val">UNKNOWN</span>
                        </div>
                        <div class="stat-box" id="stat-resolution">
                            <span class="label">Resolution</span>
                            <span class="val">--</span>
                        </div>
                        <div class="stat-box" id="stat-fps">
                            <span class="label">FPS</span>
                            <span class="val">--</span>
                        </div>
                        <div class="stat-box" id="stat-bitrate">
                            <span class="label">Bitrate (kbps)</span>
                            <span class="val">--</span>
                        </div>
                    </div>
                </section>
            </div>

            <!-- SIDEBAR: EVENT LOG ONLY -->
            <aside class="sidebar">
                <div class="event-log-panel glass-panel full-height">
                    <h2>Event Log</h2>
                    <div id="event-log-container" class="log-container">
                        <div class="log-entry system-msg">[System] Bảng điều khiển đã sẵn sàng.</div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- JS -->
    <script src="/static/js/app.js"></script>
</body>
</html>
